# Explicit root-type declaration. Without it, a type named "Subscription"
# (subscription.graphql's domain type) would be picked up as the GraphQL
# subscription root by naming convention.
schema {
  query: Query
  mutation: Mutation
}

scalar DateTime
scalar Date # 2006-01-02 format
scalar Cursor
interface Node {
  id: ID! # Public ID (pulid ID format)
}

type PageInfo {
  startCursor: ID
  endCursor: ID
  hasPreviousPage: Boolean!
  hasNextPage: Boolean!
}

type Query {
  healthCheck: String!

  node(id: ID!): Node
}
