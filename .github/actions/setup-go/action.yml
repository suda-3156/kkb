name: Setup Go
description: >-
  Install Go (and any extra tools) from mise.toml with module caching and
  download dependencies.
  The repository must already be checked out: local actions are resolved from
  the workspace, so this cannot include the checkout step itself.

inputs:
  extra-tools:
    description: >-
      Space-separated mise.toml tools to install alongside Go, e.g.
      "golangci-lint".
    required: false
    default: ""

runs:
  using: composite
  steps:
    # mise.toml is the source of tool versions.
    - id: mise
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        install_args: go ${{ inputs.extra-tools }}

    # Without this, a go.mod that asks for a newer Go than mise.toml makes the
    # go command download that toolchain itself, and CI silently stops using
    # the mise.toml version. Failing loudly is the point.
    - run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      shell: bash

    # actions/setup-go used to cache these; mise-action only caches the tools.
    - id: go-env
      run: |
        echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "buildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-env.outputs.modcache }}
          ${{ steps.go-env.outputs.buildcache }}
        key: go-${{ runner.os }}-${{ steps.go-env.outputs.version }}-${{ hashFiles('go/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ steps.go-env.outputs.version }}-

    # No `go clean -modcache` afterwards: the runner is disposable, and clearing
    # the module cache defeats the cache above, whose post step saves it.
    - run: go mod download
      shell: bash
      working-directory: ./go
