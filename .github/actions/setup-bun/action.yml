name: Setup Bun
description: >-
  Set up Bun and install the frontend dependencies.
  The repository must already be checked out: local actions are resolved from
  the workspace, so this cannot include the checkout step itself.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

    - run: bun install
      shell: bash
      working-directory: ./ts
