name: Setup Bun
description: >-
  Install Bun from mise.toml and install the frontend dependencies.
  The repository must already be checked out: local actions are resolved from
  the workspace, so this cannot include the checkout step itself.

runs:
  using: composite
  steps:
    # mise.toml is the source of tool versions.
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        install_args: bun

    - run: bun install
      shell: bash
      working-directory: ./ts
