name: Go CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  # Literal prefix rather than ${{ github.workflow }}: that context belongs to
  # the caller inside a reusable workflow, so an expression-built group can
  # collide between workflows. A literal is unambiguous either way.
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files-changed:
    uses: ./.github/workflows/files-changed.yaml
    permissions:
      contents: read
      pull-requests: read

  # Whether to run lives here; what to run lives in go-checks.yml. deploy.yml
  # calls the same checks without this gate.
  checks:
    needs: files-changed
    if: needs.files-changed.outputs.go == 'true'
    uses: ./.github/workflows/go-checks.yml
    permissions:
      contents: read
      checks: write # dorny/test-reporter
