name: TypeScript CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  # See go-ci.yml for why this is a literal and not ${{ github.workflow }}.
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files-changed:
    uses: ./.github/workflows/files-changed.yaml
    permissions:
      contents: read
      pull-requests: read

  # Whether to run lives here; what to run lives in ts-checks.yml. deploy.yml
  # calls the same checks without this gate.
  checks:
    needs: files-changed
    if: needs.files-changed.outputs.ts == 'true'
    uses: ./.github/workflows/ts-checks.yml
    permissions:
      contents: read
