name: Detect Files Changed

on:
  workflow_call:
    outputs:
      go:
        value: ${{ jobs.detect.outputs.go }}
      ts:
        value: ${{ jobs.detect.outputs.ts }}
      containers:
        value: ${{ jobs.detect.outputs.containers }}
      db:
        value: ${{ jobs.detect.outputs.db }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.changes.outputs.go_any_modified == 'true' || steps.changes.outputs.ci_any_modified == 'true' }}
      ts: ${{ steps.changes.outputs.ts_any_modified == 'true' || steps.changes.outputs.ci_any_modified == 'true' }}
      containers: ${{ steps.changes.outputs.containers_any_modified == 'true' || steps.changes.outputs.ci_any_modified == 'true' }}
      db: ${{ steps.changes.outputs.db_any_modified == 'true' || steps.changes.outputs.ci_any_modified == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        id: changes
        with:
          # schema/ belongs to both: go/gqlgen.yml and ts/codegen.ts both read
          # ../schema/*.graphql, so a schema-only change has to run both
          # `generate` checks — they are what catches stale generated code.
          files_yaml: |
            go:
              - go/**/*
              - schema/**/*

            ts:
              - ts/**/*
              - schema/**/*

            containers:
              - containers/**/*

            # db/migrations is copied into the migrate image.
            db:
              - db/**/*

            ci:
              - .github/workflows/**/*
              - .github/actions/**/*
