name: Deploy

# Tagging main triggers a release: verify -> checks -> build -> migrate -> deploy.
# workflow_dispatch takes an explicit ref so a previous tag can be redeployed as
# a rollback. Rolling traffic back to an existing revision needs no build at all
# — see `task rollback` in the terraform repo.
#
# The checks are the same reusable workflows go-ci.yml / ts-ci.yml use. There
# they run behind a files-changed gate; here they always run, because a release
# ships everything. Remaining ideas are in .local.ignore/ai/gha-workflow-review.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or SHA to deploy"
        required: true
        type: string

# Never let two deploys interleave: they would race on the same Cloud Run
# service. Queue instead of cancelling, so a half-finished migration is not
# abandoned.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # A tag fires this workflow no matter which branch it points at, so confirm
  # the commit is actually on main before spending a build on it. Runs in
  # parallel with the checks so a bad ref fails in seconds.
  verify-ref:
    name: Verify the ref is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
          # merge-base needs enough history to reach the fork point.
          fetch-depth: 0

      - run: |-
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$(git rev-parse --short HEAD) is not an ancestor of origin/main — refusing to deploy"
            exit 1
          fi

  # Verify the commit being deployed, not whatever the workflow file came from:
  # a reusable workflow is always read from the caller's commit, but the ref
  # input decides what gets checked out inside it.
  go-checks:
    uses: ./.github/workflows/go-checks.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
    permissions:
      contents: read
      checks: write # dorny/test-reporter

  ts-checks:
    uses: ./.github/workflows/ts-checks.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
    permissions:
      contents: read

  deploy:
    name: Build and deploy
    needs: [verify-ref, go-checks, ts-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Add required reviewers to this environment in repository settings to gate
    # production deploys behind manual approval.
    environment: production
    env:
      REPO: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kkb-repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Set variables
        id: vars
        run: |-
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          create_credentials_file: true
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "latest"

      # Writes a credential helper into ~/.docker/config.json, which buildx uses
      # to push.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Images are tagged with the commit SHA, never `latest`, so every deployed
      # revision points at an immutable image that can be redeployed as-is.
      # Each image caches to its own scope so they do not evict each other.
      - name: Build and push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./ts
          file: ./containers/next.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REPO }}/frontend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./go
          file: ./containers/backend.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REPO }}/backend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push migrate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./containers/migrate.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REPO }}/migrate:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      # Migration runs before the deploy: the new schema has to be in place
      # before the code that expects it starts serving. This requires migrations
      # to stay backward compatible with the currently deployed revision.
      - name: Apply database migrations
        env:
          TAG: ${{ steps.vars.outputs.sha_short }}
        run: |-
          gcloud run jobs update kkb-migrate \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --container=migrate --image="${REPO}/migrate:${TAG}"
          gcloud run jobs execute kkb-migrate \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --wait

      # One command, one revision. Updating the containers separately would
      # create two revisions and briefly serve mismatched frontend/backend
      # versions. Non-container flags must come before the first --container.
      - name: Deploy to Cloud Run
        env:
          TAG: ${{ steps.vars.outputs.sha_short }}
        run: |-
          gcloud run services update kkb \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --container=frontend --image="${REPO}/frontend:${TAG}" \
            --container=backend  --image="${REPO}/backend:${TAG}"

      # The daily tasks job runs from the same backend image (command override
      # to /bin/job), so point it at the digest that just went live. Update
      # only; Cloud Scheduler executes it on its own schedule.
      - name: Update the daily tasks job
        env:
          TAG: ${{ steps.vars.outputs.sha_short }}
        run: |-
          gcloud run jobs update kkb-tasks \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --container=tasks --image="${REPO}/backend:${TAG}"

      - name: Result
        run: |-
          {
            echo "Deployed \`${{ steps.vars.outputs.sha_short }}\` (ref: ${{ inputs.ref || github.ref_name }})"
            echo
            gcloud run services describe kkb \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --region="${{ secrets.GCP_REGION }}" \
              --format="value(status.latestReadyRevisionName)"
          } >> "$GITHUB_STEP_SUMMARY"
