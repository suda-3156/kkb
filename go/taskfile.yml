version: "3"

tasks:
  default:
    cmds:
      - task -l --sort none
    silent: true

  test:
    desc: "Run Go tests \t usage: `task <prefix>:test -- <package_path>` or `task <prefix>:test`"
    dir: .
    cmds:
      - |
        if [ -z "{{ .CLI_ARGS }}" ]; then
          go test -v ./...
          exit 0
        fi
        go test -v {{ .CLI_ARGS }}
    silent: true

  test:integration:
    desc: "Run Go tests that need a real MySQL server (Docker required, not part of `check`) \t usage: `task <prefix>:test:integration`"
    dir: .
    cmds:
      # These live behind the `integration` build tag in internal/dbtest, so
      # they are invisible to every other task. Docker has to be running.
      #
      # -count=1 disables the test cache on purpose: the point of this task is
      # to have actually talked to a database, and a cached pass looks the same
      # as a real one.
      - go test -tags integration -count=1 -v ./internal/dbtest/...
    silent: true

  lint:
    desc: "Run Go linters \t usage: `task <prefix>:lint -- <package_path>` or `task <prefix>:lint`"
    dir: .
    cmds:
      - |
        if [ -z "{{ .CLI_ARGS }}" ]; then
          golangci-lint run ./...
          exit 0
        fi
        golangci-lint run {{ .CLI_ARGS }}
    silent: true

  build:
    desc: "Compile every Go package \t usage: `task <prefix>:build`"
    dir: .
    cmds:
      - go build ./...
    silent: true

  build:image:
    desc: "Build all Go app images \t usage: `task <prefix>:build:images"
    dir: .
    cmds:
      - |
        docker buildx build \
          --platform linux/amd64 \
          --file ../containers/backend.dockerfile \
          .
        docker buildx build \
          --platform linux/amd64 \
          --file ../containers/migrate.dockerfile \
          ../
    silent: true

  generate:
    desc: "Regenerate ent/gqlgen output and fail if it is out of date \t usage: `task <prefix>:generate`"
    dir: .
    cmds:
      # Compare the working tree before and after, not against a clean tree: the
      # check has to be usable while other work is uncommitted. Only files that
      # `go generate` itself touches may differ.
      #
      # Always run the whole `./...`: the `//go:generate` directives use
      # `go run -mod=mod`, so generating also resolves tool versions into go.mod.
      # Generating one package at a time leaves the output and go.mod disagreeing.
      - |
        before=$(git status --porcelain -- .)
        go generate ./...
        after=$(git status --porcelain -- .)
        if [ "$before" != "$after" ]; then
          echo "Generated files are out of date. Review the diff and commit it."
          git --no-pager diff --stat -- .
          exit 1
        fi
    silent: true

  check:
    desc: "Run every Go check: build, lint, test, generate \t usage: `task <prefix>:check`"
    cmds:
      - task: build
      - task: lint
      - task: test
      - task: generate
    silent: true
